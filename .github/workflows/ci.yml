# lain CI — does the tree build, and do its tests pass, on the three platforms it claims to
# support? Modelled on archimedes' workflow, with the differences noted where they occur.
#
# WHAT THIS DOES NOT COVER, deliberately: the GPU. The one [gpu] test self-SKIPs unless
# LAIN_GUI_SMOKE=1, and gui-mode is verified by hand on a Metal-capable machine. A hosted
# runner has no driver worth trusting, and a windowed smoke that passes for the wrong reason
# is worse than one that never ran.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  # A dispatched run can ask for every leg to run the comprehensive tests (the Test step, below), for
  # a check before a merge or of a platform question. A push or a pull request runs the default tier.
  workflow_dispatch:
    inputs:
      tests:
        description: Which tests every build leg runs
        type: choice
        options: [ci, comprehensive]
        default: ci

permissions:
  contents: read

env:
  # The headers the Linux builds need from apt, for GLFW 3.4's two backends and the Vulkan loader
  # archimedes builds from source. Both install steps take this list.
  # - GLFW's X11 backend: X11 and its Xkb (libx11-dev), Xrandr, Xinerama, Xcursor, Xi, and Xshape
  #   (libxext-dev).
  # - GLFW's Wayland backend: wayland-client, -cursor, -egl and wayland-scanner (libwayland-dev, which
  #   brings libwayland-bin), and xkbcommon. GLFW carries its own protocol XML, so wayland-protocols
  #   is not needed.
  # - The Vulkan loader: xcb (libx11-dev brings libxcb1-dev), x11 and xrandr.
  # They are named one by one, with --no-install-recommends. The list used to be xorg-dev and the
  # recommended packages, 82 packages and 24.7 MB, most of which nothing here uses. From a slow mirror
  # that download took 5 minutes, and 12 to 14 on three legs of run 44493095641 (2026-11-19).
  LINUX_WINDOWING_PACKAGES: >-
    libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
    libwayland-dev libxkbcommon-dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job, not a step inside a build leg: formatting feedback should still arrive while a
  # build leg is red. The binary is the repo's PINNED clang-format 20 (cmake/addclangformat.cmake),
  # which exists precisely so CI and every developer machine format identically.
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache fetched tools
        uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: ${{ runner.os }}-format-${{ hashFiles('.clang-format', '.clang-format-include', 'cmake/addclangformat.cmake') }}
          restore-keys: |
            ${{ runner.os }}-format-

      - name: Configure formatter
        run: >
          cmake -S . -B build-format
          -DLAIN_FORMAT=ON
          -DLAIN_BUILD_TESTING=OFF
          -DLAIN_BUILD_APPS=OFF

      - name: Check formatting
        run: cmake --build build-format --target format-check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # bash everywhere, Windows included (Git Bash ships on the runner), so one command shape
    # serves all three legs and the binary paths below need no per-shell quoting.
    defaults:
      run:
        shell: bash

    strategy:
      # Never cancel siblings: a platform-specific failure is the whole point of this matrix, and
      # one red leg must not hide what the other three would have told us.
      fail-fast: false
      matrix:
        include:
          # Release is what a fresh clone gets (CMakeLists defaults CMAKE_BUILD_TYPE to it) and is
          # the configuration that has rotted before. Debug rides along on the cheapest runner
          # because it is a genuinely different test set — the assert-based and NDEBUG-guarded
          # enforcement cases only exist there.
          #
          # One leg has to prove that a build WITHOUT the fetched prebuilts still builds and passes:
          # it is what a platform with no prebuilt gets, and what -D...=OFF gets anywhere. (It was
          # the default configuration until FFmpeg and OpenCV began defaulting ON at top level,
          # 2026-10-02.) That leg is Linux, as is the no-refiner leg below: Linux does the work in
          # about three minutes where macOS takes seventeen, so the cheap runner is the one asked for
          # each extra configuration.
          # It was macOS at first, on the reasoning that a platform built by hand daily needs CI
          # least — which inverted once the timings arrived, because the daily build has video ON.
          # CI was spending its most expensive leg on a combination nobody builds while never
          # exercising the one that is built every day.
          #
          # Each axis varies alone. The video-off leg is Release, since Release is what a fresh
          # clone gets; Debug stays video-ON so it matches the daily build.
          #
          # `camera` (LAIN_CAMERA_OPENCV, ADR-0026) moves with `video`, and `ceres`
          # (LAIN_CAMERA_CERES, ADR-0017) with `camera`, except on one leg. Every leg states all
          # three rather than leaning on the defaults, since the tests follow what was BUILT: a leg
          # whose plugin was silently skipped would still pass. The video-off leg proves an all-off
          # build fetches nothing, and every other leg proves the fetches, the manifest gates, Ceres'
          # source build and the [video]/[opencv]/[ceres] runtime tests on its platform.
          #
          # The one exception is the no-refiner leg: OpenCV without Ceres, a build that can detect,
          # calibrate by board and extract features but refine nothing. The camera tests have a branch
          # for it (targetless methods report NoRefiner, and only after a board attempt that needs no
          # refiner), which until 2026-10-21 only a local build ever ran (M9's 2026-10-20 review, P4).
          #
          # Every leg builds with Ninja, so every leg is single-config: the build type is
          # CMAKE_BUILD_TYPE alone, and an executable sits in its target's own directory.
          #
          # One leg, `comprehensive`, runs every test case. The others run the CI tier, which leaves
          # out the cases tagged [comprehensive], those taking 20 s or more on some runner (the Test
          # step, and lain_discover_tests in cmake/addcatch2.cmake).
          - name: Linux Release
            os: ubuntu-24.04
            build_type: Release
            video: 'ON'
            camera: 'ON'
            ceres: 'ON'
            linux_deps: true
            jobs: 4
            flowview: build/apps/flowview/flowview

          # Every optional dependency off, on the fastest runner.
          - name: Linux Release (video off)
            os: ubuntu-24.04
            build_type: Release
            video: 'OFF'
            camera: 'OFF'
            ceres: 'OFF'
            linux_deps: true
            jobs: 4
            flowview: build/apps/flowview/flowview

          # OpenCV without Ceres, the one leg where `ceres` does not follow `camera` (above).
          - name: Linux Release (no refiner)
            os: ubuntu-24.04
            build_type: Release
            video: 'ON'
            camera: 'ON'
            ceres: 'OFF'
            linux_deps: true
            jobs: 4
            flowview: build/apps/flowview/flowview

          # Debug with libstdc++'s assertions on, so `*optional`, `operator[]`, `front()`, `back()` and
          # their kin abort on a broken precondition instead of reading past it. MSVC's Debug library
          # checks these and libstdc++ checks nothing by default: a test that dereferenced an empty
          # optional aborted in the repo owner's MSVC Debug build, and passed on every leg here for weeks
          # against whatever bytes the optional held (2026-11-01). Set on the leg, not in CMakeLists, so
          # a user's Debug build means what it always has.
          - name: Linux Debug
            os: ubuntu-24.04
            build_type: Debug
            video: 'ON'
            camera: 'ON'
            ceres: 'ON'
            linux_deps: true
            jobs: 4
            flowview: build/apps/flowview/flowview
            cxxflags: -D_GLIBCXX_ASSERTIONS

          # libc++'s extensive hardening, the counterpart of the Linux Debug leg's assertions. Release
          # is no reason to leave it off: it is the only build in which the release-only cases
          # (`lain::testing::skipInDebug`) run with the standard library checking anything, since both
          # Debug builds that check, MSVC's and the Linux leg, skip them. It defines no NDEBUG and
          # changes no layout, so this is still the build a fresh clone gets, with traps added.
          #
          # That is also why this is the comprehensive leg: the [comprehensive] cases are mostly
          # release-only ones, so on any other leg they would run with nothing checking. They are
          # also where macOS has turned out to differ, its SIFT features among them (2026-10-19).
          - name: macOS Release
            os: macos-15
            build_type: Release
            video: 'ON'
            camera: 'ON'
            ceres: 'ON'
            linux_deps: false
            comprehensive: true
            jobs: 3
            flowview: build/apps/flowview/flowview
            cxxflags: -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE

          # MSVC through Ninja, as the repo owner builds, not through Visual Studio's generator.
          # `msvc` sets up the compiler's environment, which MSBuild used to set up itself.
          - name: Windows Release
            os: windows-2022
            build_type: Release
            video: 'ON'
            camera: 'ON'
            ceres: 'ON'
            linux_deps: false
            msvc: true
            jobs: 4
            flowview: build/apps/flowview/flowview.exe

    steps:
      # submodules: recursive is the one thing this workflow needs that archimedes' does not —
      # lain carries extern/archimedes, and without it the very first add_subdirectory fails.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Downloaded ARCHIVES only; the dependencies themselves are recompiled from source each run.
      # One path covers everything: archimedes' own addXXX.cmake modules write to
      # ${CMAKE_SOURCE_DIR}/.cache/fetch, which resolves to lain's root when it is nested here.
      # The video, camera and ceres flags are in the key because the FFmpeg and OpenCV archives and
      # the Ceres and Eigen sources are fetched only when they are ON.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: ${{ runner.os }}-deps-video${{ matrix.video }}-camera${{ matrix.camera }}-ceres${{ matrix.ceres }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'plugins/**/CMakeLists.txt', 'extern/archimedes/cmake/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-deps-video${{ matrix.video }}-camera${{ matrix.camera }}-ceres${{ matrix.ceres }}-
            ${{ runner.os }}-deps-video${{ matrix.video }}-camera${{ matrix.camera }}-
            ${{ runner.os }}-deps-

      # The windowing headers are LINUX_WINDOWING_PACKAGES, at the top of this file.
      # libva2, libva-drm2: the Linux FFmpeg prebuilt is configured --enable-vaapi (its MANIFEST.txt
      # says so), so libavcodec.so names libva.so.2 and libva-drm.so.2 in DT_NEEDED and the linker has
      # to find them for every executable that links the video plugin (CI, 2026-09-04). It resolves
      # those by soname, so the runtime packages are enough, and addFFmpeg.cmake checks for exactly
      # those files. It is the only flag in that build needing an external shared library: v4l2-m2m
      # is kernel headers, and nvenc/ffnvcodec are dlopen'd.
      # ninja-build: the generator every leg builds with.
      - name: Install Linux windowing dependencies
        if: ${{ matrix.linux_deps }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_WINDOWING_PACKAGES libva2 libva-drm2 ninja-build

      - name: Install Ninja
        if: ${{ runner.os == 'macOS' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: command -v ninja || brew install ninja

      # cl's INCLUDE, LIB and PATH, which Visual Studio's generator had MSBuild set up and Ninja does
      # not. The environment also brings the Ninja that ships with Visual Studio.
      - name: Set up the MSVC environment
        if: ${{ matrix.msvc }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # LAIN_BUILD_TESTING and LAIN_BUILD_APPS default ON for a top-level build, so the full
      # graph — libraries, plugins, the app stack and flowview — is what gets configured.
      #
      # A leg's `cxxflags` goes in through CXXFLAGS, not -DCMAKE_CXX_FLAGS. CMake adds CXXFLAGS to the
      # compiler's own defaults on the first configure, where a CMAKE_CXX_FLAGS on the command line
      # replaces them: an empty one would drop MSVC's /EHsc on the Windows leg. It reaches every C++
      # target this configure creates, third-party ones included. The prebuilt FFmpeg and OpenCV were
      # built without it and still link, since neither library's checks change a type's layout.
      #
      # CC and CXX name cl on the MSVC leg: CMake's own search tries c++ and g++ before cl, and a
      # Windows runner can have a MinGW g++ on its PATH. Empty on the other legs, where CMake ignores
      # them.
      - name: Configure
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
          CC: ${{ matrix.msvc && 'cl' || '' }}
          CXX: ${{ matrix.msvc && 'cl' || '' }}
        run: |
          echo "$(cmake --version | head -1), ninja $(ninja --version)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLAIN_IO_VIDEO_FFMPEG=${{ matrix.video }} \
            -DLAIN_CAMERA_OPENCV=${{ matrix.camera }} \
            -DLAIN_CAMERA_CERES=${{ matrix.ceres }}

      # A check that is off passes exactly as one that found nothing, and a standard library that does
      # not know a macro ignores it without a word. So before a build is spent on them, the flags this
      # configure cached must catch what they are here for: an empty optional, dereferenced, aborts.
      - name: Prove the library checks are on
        if: ${{ matrix.cxxflags }}
        run: |
          flags=$(sed -n 's/^CMAKE_CXX_FLAGS:STRING=//p' build/CMakeCache.txt)
          printf '#include <optional>\nint main() { std::optional<int> none; (void)*none; }\n' > "$RUNNER_TEMP/probe.cpp"
          c++ -std=c++17 $flags "$RUNNER_TEMP/probe.cpp" -o "$RUNNER_TEMP/probe"
          if "$RUNNER_TEMP/probe"; then
            echo "An empty optional was dereferenced and nothing stopped it, under CMAKE_CXX_FLAGS '$flags'."
            exit 1
          fi

      # A job count, never a bare --parallel. Under the Makefile generator a bare one was `make -j`
      # with no limit, and on macOS's runner (3 cores, 7 GB) as many compilers as the graph allowed
      # thrashed its memory: its Build step took 62 minutes on 2026-10-05 against 6 on Linux, and
      # once Ceres' Eigen-heavy sources joined the build it passed the 90-minute timeout (2026-10-19).
      # Ninja's own default is the core count plus two, still more than an Eigen-heavy build fits in
      # 7 GB. Each leg's `jobs` is its runner's core count.
      - name: Build
        run: cmake --build build --parallel ${{ matrix.jobs }}

      # PARALLEL on purpose, since 2026-09-10. It used to be serial because twenty test files each
      # wrote into the shared fs::temp_directory_path() and -j made them collide; they now take
      # their paths from lain::testing, which roots them in a per-PROCESS directory (see
      # libs/testing/include/lain/testing/scratch.h — catch_discover_tests runs every case as its
      # own process, which is what defeats a per-file counter). Running -j here is what keeps that
      # true: the collision was invisible to a serial run, so a serial CI could not have caught it
      # coming back. A [gpu] SKIP reports as a ctest skip, not a failure — catch_discover_tests
      # sets SKIP_RETURN_CODE=4.
      #
      # The CI tier, `-LE comprehensive`, on every leg but the comprehensive one, unless a dispatched
      # run asks for every case everywhere. The [comprehensive] cases take 20 s or more on some runner,
      # and on 2026-11-19 they were 90 to 95 percent of each leg's test time.
      - name: Test
        run: |
          tier=(-LE comprehensive)
          if [ "${{ matrix.comprehensive }}" = true ] || [ "${{ inputs.tests }}" = comprehensive ]; then
            tier=()
          fi
          ctest --test-dir build --output-on-failure --parallel 4 "${tier[@]}"

      # ctest links runmode.cpp into the test binary, so it never exercises the SHIPPED
      # executable. This does: that flowview launches at all, and resolves its dynamic
      # dependencies — which on Windows with FFmpeg ON is the real question.
      - name: Smoke the flowview binary
        run: |
          ${{ matrix.flowview }} --version
          ${{ matrix.flowview }} list
          ${{ matrix.flowview }} run

      # An example document, run from a folder that is NOT the document's: its data paths are
      # stored relative to the document (ADR-0027), so this checks the shipped binary resolves them
      # against the document rather than the working directory. $PWD is POSIX-form in every leg's
      # bash, and Git Bash converts such arguments for a native Windows executable.
      - name: Smoke an example document
        run: |
          root="$PWD"
          example="$root/apps/flowview/examples/folder-average.json"
          mkdir -p "$root/smoke-elsewhere"
          cd "$root/smoke-elsewhere"
          "$root/${{ matrix.flowview }}" list -g "$example"
          "$root/${{ matrix.flowview }}" run -g "$example" --result "$root/smoke-elsewhere/folder-average.png"
          test -s "$root/smoke-elsewhere/folder-average.png"

      - name: Report third-party licences
        if: ${{ matrix.video == 'ON' }}
        run: ${{ matrix.flowview }} --licenses

  # Proves TWO claims with one job, because LAIN_BUILD_TESTING / _APPS / _FORMAT all default to
  # ${LAIN_NOT_SUBPROJECT}: that lain is consumable via add_subdirectory, and that a headless
  # consumer of lain::flow is not forced to vendor the GUI stack or build a Vulkan loader.
  # Linux only — this is CMake wiring, not compiler behaviour, so once is enough.
  subproject:
    name: add_subdirectory smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A different cache path from the legs above: CMAKE_SOURCE_DIR is the parent project here,
      # so the fetched archives land under it instead of under lain's root.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .github/subproject-smoke/.cache/fetch
          key: ${{ runner.os }}-subproject-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/subproject-smoke/*') }}
          restore-keys: |
            ${{ runner.os }}-subproject-

      # lain's add_subdirectory(extern/archimedes) is unconditional, so archimedes builds even in
      # a headless consumer build and these are still wanted.
      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_WINDOWING_PACKAGES ninja-build

      - name: Configure parent project
        run: >
          cmake -S .github/subproject-smoke -B build-subproject -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLAIN_SOURCE_DIR=${{ github.workspace }}

      - name: Build parent project
        run: cmake --build build-subproject --parallel 4
