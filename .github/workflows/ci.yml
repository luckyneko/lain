# lain CI — does the tree build, and do its tests pass, on the three platforms it claims to
# support? Modelled on archimedes' workflow, with the differences noted where they occur.
#
# WHAT THIS DOES NOT COVER, deliberately: the GPU. The one [gpu] test self-SKIPs unless
# LAIN_GUI_SMOKE=1, and gui-mode is verified by hand on a Metal-capable machine. A hosted
# runner has no driver worth trusting, and a windowed smoke that passes for the wrong reason
# is worse than one that never ran.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job, not a step inside a build leg: formatting feedback should still arrive while a
  # build leg is red. The binary is the repo's PINNED clang-format 20 (cmake/addclangformat.cmake),
  # which exists precisely so CI and every developer machine format identically.
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache fetched tools
        uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: ${{ runner.os }}-format-${{ hashFiles('.clang-format', '.clang-format-include', 'cmake/addclangformat.cmake') }}
          restore-keys: |
            ${{ runner.os }}-format-

      - name: Configure formatter
        run: >
          cmake -S . -B build-format
          -DLAIN_FORMAT=ON
          -DLAIN_BUILD_TESTING=OFF
          -DLAIN_BUILD_APPS=OFF

      - name: Check formatting
        run: cmake --build build-format --target format-check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # bash everywhere, Windows included (Git Bash ships on the runner), so one command shape
    # serves all three legs and the binary paths below need no per-shell quoting.
    defaults:
      run:
        shell: bash

    strategy:
      # Never cancel siblings: a platform-specific failure is the whole point of this matrix, and
      # one red leg must not hide what the other three would have told us.
      fail-fast: false
      matrix:
        include:
          # Release is what a fresh clone gets (CMakeLists defaults CMAKE_BUILD_TYPE to it) and is
          # the configuration that has rotted before. Debug rides along on the cheapest runner
          # because it is a genuinely different test set — the assert-based and NDEBUG-guarded
          # enforcement cases only exist there.
          #
          # One leg has to prove that a build WITHOUT the fetched prebuilts still builds and passes:
          # it is what a platform with no prebuilt gets, and what -D...=OFF gets anywhere. (It was
          # the default configuration until FFmpeg and OpenCV began defaulting ON at top level,
          # 2026-10-02.) That leg is Linux, as is the no-refiner leg below: Linux does the work in
          # about three minutes where macOS takes seventeen, so the cheap runner is the one asked for
          # each extra configuration.
          # It was macOS at first, on the reasoning that a platform built by hand daily needs CI
          # least — which inverted once the timings arrived, because the daily build has video ON.
          # CI was spending its most expensive leg on a combination nobody builds while never
          # exercising the one that is built every day.
          #
          # Each axis varies alone. The video-off leg is Release, since Release is what a fresh
          # clone gets; Debug stays video-ON so it matches the daily build.
          #
          # `camera` (LAIN_CAMERA_OPENCV, ADR-0026) moves with `video`, and `ceres`
          # (LAIN_CAMERA_CERES, ADR-0017) with `camera`, except on one leg. Every leg states all
          # three rather than leaning on the defaults, since the tests follow what was BUILT: a leg
          # whose plugin was silently skipped would still pass. The video-off leg proves an all-off
          # build fetches nothing, and every other leg proves the fetches, the manifest gates, Ceres'
          # source build and the [video]/[opencv]/[ceres] runtime tests on its platform.
          #
          # The one exception is the no-refiner leg: OpenCV without Ceres, a build that can detect,
          # calibrate by board and extract features but refine nothing. The camera tests have a branch
          # for it (targetless methods report NoRefiner, and only after a board attempt that needs no
          # refiner), which until 2026-10-21 only a local build ever ran (M9's 2026-10-20 review, P4).
          - name: Linux Release
            os: ubuntu-24.04
            build_type: Release
            video: 'ON'
            camera: 'ON'
            ceres: 'ON'
            linux_deps: true
            jobs: 4
            flowview: build/apps/flowview/flowview
            rigplan: build/apps/rigplan/rigplan

          # Every optional dependency off, on the fastest runner.
          - name: Linux Release (video off)
            os: ubuntu-24.04
            build_type: Release
            video: 'OFF'
            camera: 'OFF'
            ceres: 'OFF'
            linux_deps: true
            jobs: 4
            flowview: build/apps/flowview/flowview
            rigplan: build/apps/rigplan/rigplan

          # OpenCV without Ceres, the one leg where `ceres` does not follow `camera` (above).
          - name: Linux Release (no refiner)
            os: ubuntu-24.04
            build_type: Release
            video: 'ON'
            camera: 'ON'
            ceres: 'OFF'
            linux_deps: true
            jobs: 4
            flowview: build/apps/flowview/flowview
            rigplan: build/apps/rigplan/rigplan

          - name: Linux Debug
            os: ubuntu-24.04
            build_type: Debug
            video: 'ON'
            camera: 'ON'
            ceres: 'ON'
            linux_deps: true
            jobs: 4
            flowview: build/apps/flowview/flowview
            rigplan: build/apps/rigplan/rigplan

          - name: macOS Release
            os: macos-15
            build_type: Release
            video: 'ON'
            camera: 'ON'
            ceres: 'ON'
            linux_deps: false
            jobs: 3
            flowview: build/apps/flowview/flowview
            rigplan: build/apps/rigplan/rigplan

          # Visual Studio's generator is multi-config, so --config / -C carry the build type here
          # and CMAKE_BUILD_TYPE is ignored; both are passed so one command shape serves every leg.
          # That also puts the executables under a per-config subdirectory.
          - name: Windows Release
            os: windows-2022
            build_type: Release
            video: 'ON'
            camera: 'ON'
            ceres: 'ON'
            linux_deps: false
            jobs: 4
            flowview: build/apps/flowview/Release/flowview.exe
            rigplan: build/apps/rigplan/Release/rigplan.exe

    steps:
      # submodules: recursive is the one thing this workflow needs that archimedes' does not —
      # lain carries extern/archimedes, and without it the very first add_subdirectory fails.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Downloaded ARCHIVES only; the dependencies themselves are recompiled from source each run.
      # One path covers everything: archimedes' own addXXX.cmake modules write to
      # ${CMAKE_SOURCE_DIR}/.cache/fetch, which resolves to lain's root when it is nested here.
      # The video, camera and ceres flags are in the key because the FFmpeg and OpenCV archives and
      # the Ceres and Eigen sources are fetched only when they are ON.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: ${{ runner.os }}-deps-video${{ matrix.video }}-camera${{ matrix.camera }}-ceres${{ matrix.ceres }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'plugins/**/CMakeLists.txt', 'extern/archimedes/cmake/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-deps-video${{ matrix.video }}-camera${{ matrix.camera }}-ceres${{ matrix.ceres }}-
            ${{ runner.os }}-deps-video${{ matrix.video }}-camera${{ matrix.camera }}-
            ${{ runner.os }}-deps-

      # xorg/wayland: GLFW's backends and the from-source Vulkan loader need these headers.
      # libva: the Linux FFmpeg prebuilt is configured --enable-vaapi (its MANIFEST.txt says so),
      # so libavcodec.so carries an unresolved dependency on libva that the linker has to satisfy
      # in every consumer — without it, anything linking the video plugin fails with a page of
      # undefined `va*` references (CI, 2026-09-04). It is the only flag in that build needing an
      # external shared library: v4l2-m2m is kernel headers, and nvenc/ffnvcodec are dlopen'd.
      - name: Install Linux windowing dependencies
        if: ${{ matrix.linux_deps }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols libva-dev

      # LAIN_BUILD_TESTING and LAIN_BUILD_APPS default ON for a top-level build, so the full
      # graph — libraries, plugins, the app stack and flowview — is what gets configured.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLAIN_IO_VIDEO_FFMPEG=${{ matrix.video }}
          -DLAIN_CAMERA_OPENCV=${{ matrix.camera }}
          -DLAIN_CAMERA_CERES=${{ matrix.ceres }}

      # A job count, never a bare --parallel: under the Makefile generator a bare one is `make -j`
      # with no limit, and on macOS's runner (3 cores, 7 GB) as many compilers as the graph allows
      # thrash its memory. Its Build step took 62 minutes on 2026-10-05 against 6 on Linux, and once
      # Ceres' Eigen-heavy sources joined the build it passed the 90-minute timeout (2026-10-19). Each
      # leg's `jobs` is its runner's core count.
      - name: Build
        run: cmake --build build --parallel ${{ matrix.jobs }} --config ${{ matrix.build_type }}

      # PARALLEL on purpose, since 2026-09-10. It used to be serial because twenty test files each
      # wrote into the shared fs::temp_directory_path() and -j made them collide; they now take
      # their paths from lain::testing, which roots them in a per-PROCESS directory (see
      # libs/testing/include/lain/testing/scratch.h — catch_discover_tests runs every case as its
      # own process, which is what defeats a per-file counter). Running -j here is what keeps that
      # true: the collision was invisible to a serial run, so a serial CI could not have caught it
      # coming back. A [gpu] SKIP reports as a ctest skip, not a failure — catch_discover_tests
      # sets SKIP_RETURN_CODE=4.
      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }} --parallel 4

      # ctest links runmode.cpp into the test binary, so it never exercises the SHIPPED
      # executable. This does: that flowview launches at all, and resolves its dynamic
      # dependencies — which on Windows with FFmpeg ON is the real question.
      - name: Smoke the flowview binary
        run: |
          ${{ matrix.flowview }} --version
          ${{ matrix.flowview }} list
          ${{ matrix.flowview }} run

      # The same question for rigplan, whose dynamic dependencies are its own list (the Vulkan runtime,
      # OpenCV's DLLs for the board renderer). The next step is what makes it render.
      - name: Smoke the rigplan binary
        run: |
          ${{ matrix.rigplan }} --version
          ${{ matrix.rigplan }} render --help

      # The synthetic-capture vertical (WORK.md M15 slice 7) through the SHIPPED binaries, which ctest's
      # test-flowview-capture does not run: the committed example rig plan rendered on archimedes' CPU
      # device (no runner has a GPU, and --device cpu says so rather than leaving it to the ranking),
      # then registered by register.json and scored by compare-rigs.json, from a folder that is neither
      # the plan's nor flowview's examples'. What a leg can do follows what it built: with no board
      # renderer the render is refused, naming it; with no refiner the registration reports it. It ends
      # on `test -s`, since `run` exits 0 when a bound output is empty. Release legs only: the Debug leg
      # renders and detects for minutes, and its ctest case skips anyway.
      - name: Render, register and score the example rig plan
        if: matrix.build_type == 'Release'
        run: |
          root="$PWD"
          plan="$root/apps/rigplan/examples/three-poles.json"
          examples="$root/apps/flowview/examples"
          mkdir -p "$root/capture-elsewhere"
          cd "$root/capture-elsewhere"
          if [ "${{ matrix.camera }}" != "ON" ]; then
            if "$root/${{ matrix.rigplan }}" --device cpu render "$plan" --out capture > render.log 2>&1; then
              cat render.log
              echo "a build with no board renderer rendered a plan that waves a board"
              exit 1
            fi
            cat render.log
            grep -q "no board renderer" render.log
            test ! -e capture
            exit 0
          fi
          "$root/${{ matrix.rigplan }}" --device cpu render "$plan" --out capture
          "$root/${{ matrix.flowview }}" run -g "$examples/register.json" --footage capture/rig \
            --models capture/truth/models --report report.txt --rig rig.json
          cat report.txt
          if [ "${{ matrix.ceres }}" != "ON" ]; then
            grep -q "^Failed: NoRefiner" report.txt
            test ! -e rig.json
            exit 0
          fi
          grep -q "^Ready" report.txt
          "$root/${{ matrix.flowview }}" run -g "$examples/compare-rigs.json" --expected capture/truth/rig.json \
            --found rig.json --comparison comparison.txt
          test -s comparison.txt
          cat comparison.txt

      # An example document, run from a folder that is NOT the document's: its data paths are
      # stored relative to the document (ADR-0027), so this checks the shipped binary resolves them
      # against the document rather than the working directory. $PWD is POSIX-form in every leg's
      # bash, and Git Bash converts such arguments for a native Windows executable.
      - name: Smoke an example document
        run: |
          root="$PWD"
          example="$root/apps/flowview/examples/folder-average.json"
          mkdir -p "$root/smoke-elsewhere"
          cd "$root/smoke-elsewhere"
          "$root/${{ matrix.flowview }}" list -g "$example"
          "$root/${{ matrix.flowview }}" run -g "$example" --result "$root/smoke-elsewhere/folder-average.png"
          test -s "$root/smoke-elsewhere/folder-average.png"

      # Every leg: each one's notices differ by what it built (ADR-0015, amended 2026-10-23), and
      # this is the shipped executable's text, which test_notices.cpp checks through lain::app.
      - name: Report third-party licences
        run: ${{ matrix.flowview }} --licenses

  # Proves TWO claims with one job, because LAIN_BUILD_TESTING / _APPS / _FORMAT all default to
  # ${LAIN_NOT_SUBPROJECT}: that lain is consumable via add_subdirectory, and that a headless
  # consumer of lain::flow is not forced to vendor the GUI stack or build a Vulkan loader.
  # Linux only — this is CMake wiring, not compiler behaviour, so once is enough.
  subproject:
    name: add_subdirectory smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A different cache path from the legs above: CMAKE_SOURCE_DIR is the parent project here,
      # so the fetched archives land under it instead of under lain's root.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .github/subproject-smoke/.cache/fetch
          key: ${{ runner.os }}-subproject-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/subproject-smoke/*') }}
          restore-keys: |
            ${{ runner.os }}-subproject-

      # lain's add_subdirectory(extern/archimedes) is unconditional, so archimedes builds even in
      # a headless consumer build and these are still wanted.
      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Configure parent project
        run: >
          cmake -S .github/subproject-smoke -B build-subproject
          -DCMAKE_BUILD_TYPE=Release
          -DLAIN_SOURCE_DIR=${{ github.workspace }}

      - name: Build parent project
        run: cmake --build build-subproject --parallel 4
